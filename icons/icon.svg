<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- rounded-square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- crosshair ring -->
  <circle cx="64" cy="64" r="26" fill="none" stroke="#ffffff" stroke-width="9"/>
  <!-- crosshair ticks -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <line x1="64" y1="16" x2="64" y2="30"/>
    <line x1="64" y1="98" x2="64" y2="112"/>
    <line x1="16" y1="64" x2="30" y2="64"/>
    <line x1="98" y1="64" x2="112" y2="64"/>
  </g>
  <!-- center dot -->
  <circle cx="64" cy="64" r="9" fill="#ffffff"/>
  <!-- comment dot: amber note pinned top-right -->
  <circle cx="98" cy="30" r="16" fill="#fbbf24" stroke="#ffffff" stroke-width="5"/>
</svg>
